<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fernpage</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌿</text></svg>">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <aside class="sidebar">
    <div class="brand">🌿 Fernpage</div>
    <input id="search" type="search" placeholder="Search pages" autocomplete="off">
    <ul id="results" class="results" hidden></ul>
    <section id="favorites-section">
      <h2>Favourites</h2>
      <ul id="favorites" class="tree"></ul>
    </section>
    <section>
      <h2>Pages</h2>
      <ul id="tree" class="tree"></ul>
    </section>
    <button id="new-page" class="new-page">+ New page</button>
  </aside>

  <main id="main">
    <div id="empty" class="empty">Pick a page on the left, or make a new one.</div>
    <article id="page" hidden>
      <nav id="crumbs" class="crumbs"></nav>
      <header class="page-head">
        <button id="icon" class="icon" title="Change icon"></button>
        <input id="title" class="title" placeholder="Untitled">
        <div class="actions">
          <button id="comment-count" class="comment-count" title="Open comments" aria-label="Open comments" hidden></button>
          <button id="favorite" class="star" title="Favourite">☆</button>
          <button id="share" title="Share a public link" aria-controls="share-panel" aria-expanded="false">Share</button>
          <button id="mode" title="Switch between writing and reading">Edit</button>
          <button id="delete" class="danger" title="Delete page">Delete</button>
        </div>
      </header>
      <p id="share-error" class="share-error" role="alert" hidden></p>
      <div id="share-panel" class="share-panel" hidden>
        <p>Anyone with this link can read this page.</p>
        <input id="share-url" readonly aria-label="Public link">
        <button id="copy">Copy link</button>
        <button id="unshare" class="danger">Turn off link</button>
      </div>
      <div id="view" class="markdown"></div>
      <textarea id="body" class="body" hidden placeholder="Write in markdown…"></textarea>
      <section id="comments" class="comments" tabindex="-1">
        <h2>Comments</h2>
        <div id="threads"></div>
        <p id="comments-error" class="comments-error" hidden></p>
        <form id="new-comment" class="new-comment">
          <input id="author" aria-label="Your name" placeholder="Your name" maxlength="80" autocomplete="off">
          <textarea id="comment-body" aria-label="New comment" placeholder="Add a comment… (markdown)"></textarea>
          <button type="submit">Comment</button>
        </form>
        <details id="resolved" hidden>
          <summary id="resolved-summary"></summary>
          <div id="resolved-threads"></div>
        </details>
      </section>
      <footer id="saved" class="saved"></footer>
    </article>
  </main>

  <script src="/static/markdown.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
